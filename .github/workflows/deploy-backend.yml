name: Deploy Backend (SAM)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: SAM build
        working-directory: backend
        run: sam build

      - name: SAM deploy
        working-directory: backend
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name marketing-dashboard-backend \
            --s3-bucket ${{ secrets.SAM_ARTIFACTS_BUCKET }} \
            --region ${{ secrets.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment=prod \
              FrontendOrigin=${{ secrets.FRONTEND_ORIGIN }} \
              HubSpotAccessToken=${{ secrets.HUBSPOT_ACCESS_TOKEN }} \
              PendoApiKey=${{ secrets.PENDO_API_KEY }} \
              Ga4PropertyId=${{ secrets.GA4_PROPERTY_ID }} \
              Ga4ApiSecret=${{ secrets.GA4_API_SECRET }}
